id: morning-digest
name: Morning digest
enabled: true
source:
  type: cron
  config:
    schedule: '0 8 * * *'
target:
  type: agent
  id: nandi
input_template: |
  Morning digest. Write me a short brief for today, at most ten lines.
  Lead with my "Do now" to-dos (`todo_list`), overdue first, then any
  reminder due within 3 days, then my meetings (if a calendar is
  connected), work waiting on me, work in
  progress, what finished since yesterday, and the asks and deadlines in
  my notes. With more than one mailbox connected, group what came from
  email by mailbox, named by its address. Plain words. Say "Nothing new"
  if there is nothing.
