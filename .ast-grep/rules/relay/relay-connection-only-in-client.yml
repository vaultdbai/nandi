id: relay-connection-only-in-client
message: |
  Only src-tauri/src/services/relay/client.rs talks to the relay: it opens
  the WebSocket and speaks the wire protocol (`RelayMessage`).

  BAD: tokio_tungstenite::connect_async(relay_url) in a2a/, gateway/, ...
  GOOD: go through the `RelayClient` trait (`state.relay_client()`), and
        answer `RelayUnavailable` when it isn't connected

  Tests (`mod tests`, relay/tests.rs, relay/sealed_tests.rs) may open raw
  sockets.
severity: error
language: Rust
files:
  - 'src-tauri/src/**/*.rs'
ignores:
  - 'src-tauri/src/services/relay/client.rs'
  - 'src-tauri/src/services/relay/tests.rs'
  # A WebSocket tap in front of a test relay, recording every frame
  - 'src-tauri/src/services/relay/sealed_tests.rs'
rule:
  all:
    - any:
        # Opening a WebSocket (the relay is the only one the app dials)
        - pattern: connect_async($$$ARGS)
        - pattern: $PATH::connect_async($$$ARGS)
        - pattern: connect_async_tls_with_config($$$ARGS)
        - pattern: $PATH::connect_async_tls_with_config($$$ARGS)
        - pattern: client_async($$$ARGS)
        - pattern: $PATH::client_async($$$ARGS)
        # The wire envelope
        - kind: scoped_identifier
          regex: '(^|::)RelayMessage::'
        - kind: scoped_type_identifier
          regex: '(^|::)RelayMessage::'
    - not:
        inside:
          stopBy: end
          kind: mod_item
          has:
            field: name
            regex: '^tests$'
note: |
  See AGENTS.md "Works Without the Relay" and docs/developer/static-analysis.md.
